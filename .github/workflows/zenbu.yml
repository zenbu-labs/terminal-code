# Zenbu bot: starts a run in zenbu-labs/zenbu-bot. This repo holds only the dispatch-only key
# (Actions write on zenbu-bot); the bot's real secrets never come here. The run also gets this
# job's GitHub OIDC token, which proves the dispatch came from this repo's own workflow.
name: Zenbu bot
on:
  issues: { types: [opened, edited] }
  issue_comment: { types: [created] }
  pull_request_target: { types: [opened, synchronize, ready_for_review] }
permissions: { id-token: write }
jobs:
  dispatch:
    if: >-
      github.actor != 'zenbu-bot[bot]' && (github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '@zenbu') || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with: { app-id: "${{ vars.ZENBU_DISPATCH_APP_ID }}", private-key: "${{ secrets.ZENBU_DISPATCH_KEY }}", owner: zenbu-labs, repositories: zenbu-bot }
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          R=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=zenbu-bot-dispatch")
          [ "${R##*$'\n'}" = 200 ] || { echo "OIDC token request failed: ${R##*$'\n'} ${R%$'\n'*}"; exit 1; }
          CALLER=$(printf '%s' "${R%$'\n'*}" | jq -r .value); unset R
          echo "::add-mask::$CALLER"
          gh workflow run run.yml -R zenbu-labs/zenbu-bot --ref main -f repo="$REPO" -f event="$EVENT" -f action="$ACTION" -f number="$NUMBER" -f comment_id="$COMMENT_ID" -f head_sha="$HEAD_SHA" -f caller_token="$CALLER"
