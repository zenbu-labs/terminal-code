name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a stable release (dev build if none)"
        type: choice
        default: none
        options: [none, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.bump != 'none') && 'stable' || 'dev' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && (inputs.bump == '' || inputs.bump == 'none') }}

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      flip: ${{ steps.v.outputs.flip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          BUMP="${{ inputs.bump }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHANNEL=stable
            VERSION="${GITHUB_REF#refs/tags/}"
            REF="$VERSION"
          elif [ -n "$BUMP" ] && [ "$BUMP" != none ]; then
            CHANNEL=stable
            VERSION="$(scripts/next-version.sh "$BUMP")"
            git -c user.name="tode release" -c user.email="release@zenbu.dev" \
              tag -a "$VERSION" -m "tode $VERSION"
            git push origin "$VERSION"
            REF="$VERSION"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            CHANNEL=dev
            VERSION="main-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          else
            # A branch build publishes a pinned version anyone can install via
            # /install/v/<version>, without moving the dev channel.
            CHANNEL=dev
            FLIP=false
            BRANCH="$(printf %s "${GITHUB_REF#refs/heads/}" | tr -c "a-zA-Z0-9._-" "-")"
            VERSION="$BRANCH-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "flip=${FLIP:-true}" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # tode itself is only TypeScript, and the browser is fetched rather than
        # compiled, so one Linux runner can build every target's tarball.
        target: [darwin-x64, darwin-arm64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: scripts/release.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.channel }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist-release/tode-${{ matrix.target }}.tar.gz
            dist-release/manifest-${{ matrix.target }}.json
          if-no-files-found: error

  worker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deploy worker
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (inputs.bump != '' && inputs.bump != 'none')
        working-directory: release-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx --no-install wrangler@4.120.0 deploy

  release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    needs: [prepare, build, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install release tooling
        working-directory: release-worker
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_ORIGIN: ${{ vars.RELEASE_ORIGIN }}
          FLIP_LATEST: ${{ needs.prepare.outputs.flip }}
        run: |
          scripts/publish-r2.sh | tee /tmp/publish.log
          grep -E '^(pinned|latest)=' /tmp/publish.log >> "$GITHUB_OUTPUT" || true

      - name: GitHub release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$(printf 'Install:\n\n```sh\ncurl -fsSL %s | bash\n```\n\nPinned to this version:\n\n```sh\ncurl -fsSL %s | bash\n```\n' \
                "${{ steps.publish.outputs.latest }}" "${{ steps.publish.outputs.pinned }}")"
          fi
          gh release upload "$VERSION" dist-release/tode-*.tar.gz --clobber

      - name: Summary
        run: |
          {
            echo "### tode \`${{ needs.prepare.outputs.version }}\` (${{ needs.prepare.outputs.channel }})"
            echo
            echo "This build:"
            echo '```sh'
            echo "curl -fsSL ${{ steps.publish.outputs.pinned }} | bash"
            echo '```'
            if [ -n "${{ steps.publish.outputs.latest }}" ]; then
              echo "Always current ${{ needs.prepare.outputs.channel }}:"
              echo '```sh'
              echo "curl -fsSL ${{ steps.publish.outputs.latest }} | bash"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
